name: CI

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "tests/**"
      - "Dockerfile"
      - "requirements*.txt"
      - "pyproject.toml"
      - "Makefile"

  pull_request:
    branches: [main]
    paths:
      - "**/*.py"
      - "tests/**"
      - "Dockerfile"
      - "requirements*.txt"
      - "pyproject.toml"
      - "Makefile"

  # Allows rebuilding the current commit manually,
  # useful after Terraform recreates an empty ECR repository.
  workflow_dispatch:

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: make install

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  publish-image:
    name: Build and Push Image
    runs-on: ubuntu-latest

    needs: quality-gate

    # PRs only run quality checks.
    # Images are published only from main pushes
    # or an explicit manual workflow run.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .

          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"