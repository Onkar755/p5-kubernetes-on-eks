name: CI

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "tests/**"
      - "Dockerfile"
      - "requirements*.txt"
      - "pyproject.toml"
      - "Makefile"

  pull_request:
    branches: [main]
    paths:
      - "**/*.py"
      - "tests/**"
      - "Dockerfile"
      - "requirements*.txt"
      - "pyproject.toml"
      - "Makefile"

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: make install

      - name: Lint
        run: make lint

      - name: Test
        run: make test